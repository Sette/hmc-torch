[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hmc-torch"
version = "0.0.9"

description = "A Modular Platform for Hierarchical Multi-Label Classification with R-Matrix Constraints"
authors = [{ name = "Bruno Sette", email = "brunosilvasette@gmail.com" }]
requires-python = ">=3.11,<3.14"
readme = "README.md"
license = { text = "MIT" }
keywords = [
    "hierarchical-multi-label-classification",
    "hmc",
    "deep-learning",
    "pytorch",
    "r-matrix",
    "hierarchical-classification",
    "multi-label",
    "gene-ontology",
    "text-classification",
    "genomics",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Text Processing",
]
dependencies = [
    "tqdm==4.67.3",
    "numpy==2.4.3",
    "torch==2.10.0",
    "torchaudio==2.10.0",
    "torchvision==0.25.0",
    "pandas==3.0.1",
    "dataset==1.6.2",
    "scikit-learn==1.8.0",
    "lightning[extra]==2.6.1",
    "tensorflow==2.21.0",
    "tf-keras==2.21.0",
    "optuna==4.8.0",
    "logging==0.4.9.6",
    "torch-geometric==2.7.0",
    "transformers==5.3.0",
    "kagglehub>=1.0.2",
]

[project.optional-dependencies]
tabfm = ["tabfm[pytorch]"]
vision = ["timm", "opencv-python-headless"]
protein = ["fair-esm"]
expression = ["scipy"]

[project.urls]
Homepage = "https://github.com/Sette/hmc-torch"
Repository = "https://github.com/Sette/hmc-torch"
Documentation = "https://github.com/Sette/hmc-torch#readme"
"Issues" = "https://github.com/Sette/hmc-torch/issues"

[project.entry-points."hmc_torch.datasets"]
# Built-in datasets are auto-registered on import.
# External packages can register custom datasets here:
# my_dataset = "my_package.my_module:create_manager"

[dependency-groups]
dev = [
    "autopep8==2.3.2",
    "flake8==7.2.0",
    "black==25.1.0",
    "isort==6.0.1",
    "pre-commit==4.2.0",
    "pylint==3.3.7",
    "pytest==9.0.2",
    "jupyterlab==4.5.3",
    "jq==1.11.0",
    "yq==3.4.3",
    "setuptools>=82.0.1",
    "ruff>=0.15.8",
    "pytest-cov>=7.1.0",
    "kaggle>=2.1.2",
]

[tool.uv]
default-groups = "all"

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch" }
torchaudio = { index = "pytorch" }
torchvision = { index = "pytorch" }

[tool.hatch.build.targets.sdist]
include = ["src/hmc"]

[tool.hatch.build.targets.wheel]
include = ["src/hmc"]

[tool.hatch.build.targets.wheel.sources]
"src/hmc" = "hmc"

[tool.pylint.main]
init-hook = "import sys; sys.path.append('src')"
recursive = true

[tool.pylint.format]
max-line-length = 120

[tool.pylint.basic]
# Short conventional names and single uppercase letters for ML (X=features, Y=labels)
good-names = "X,Y,lr,i,j,k,f,e,ex,fp,id"
# Allow any lowercase-starting name (any length) + uppercase-prefixed ML names (X_embed, Y_global)
variable-rgx = "^([a-z_][a-z0-9_]{0,30}|[A-Z][A-Za-z0-9_]*)$"
argument-rgx = "^([a-z_][a-z0-9_]{0,30}|[A-Z][A-Za-z0-9_]*)$"

[tool.pylint.design]
max-args = 10
max-positional-arguments = 10
max-locals = 36
max-attributes = 20
max-statements = 70
min-public-methods = 0

[tool.pylint."messages control"]
disable = [
    "E1101",   # no-member: numpy/torch dynamic attributes cause false positives
    "W0201",   # attribute-defined-outside-init: intentional lazy initialization pattern
    "R0801",   # duplicate-code: expected across dataset managers with shared patterns
]

[tool.ruff]
exclude = ["experiments/"]
force-exclude = true

[tool.ruff.lint]
ignore = [
    "LOG015",  # project uses root logger pattern widely
    "BLE001",  # blind except: acceptable in download/fallback code
    "S110",    # try-except-pass: acceptable in optional dependency handling
    "PLW1510", # subprocess.run without explicit check (handled via git wrappers)
    "I001",    # isort ordering: ruff format already handles import sorting
]
