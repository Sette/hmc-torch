name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - name: Check RELEASE_PLEASE_TOKEN
        env:
          TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::secrets.RELEASE_PLEASE_TOKEN is empty. Add it under Settings > Secrets and variables > Actions > Repository secrets of ${{ github.repository }}."
            exit 1
          fi

      # A PAT (not GITHUB_TOKEN) so the release/tag it creates also triggers
      # python-publish.yml and docker-publish.yml.
      - uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
